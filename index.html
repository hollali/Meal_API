<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search for meals from around the world and discover recipes, ingredients, and instructions powered by the TheMealDB API.">
    <meta name="theme-color" content="#0b6b62">
    <script>
        (function () {
            try {
                var stored = JSON.parse(localStorage.getItem('meal-app-theme'));
                if (stored !== 'light' && stored !== 'dark') {
                    stored =
                        window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                            ? 'dark'
                            : 'light';
                }
                document.documentElement.dataset.theme = stored;
            } catch (error) {
                document.documentElement.dataset.theme = 'light';
            }
        })();
    </script>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="shortcut icon" href="./icons/breakfast.png" type="image/x-icon">
    <link rel="apple-touch-icon" href="./icons/breakfast.png">
    <title>Foreign Foods · Meal Search</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"><i class="fas fa-utensils"></i></span>
                <div class="brand-text">
                    <h1 class="heading">Foreign Foods</h1>
                    <p class="tagline">Discover recipes from around the world</p>
                </div>
            </div>
            <button type="button" id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
                <i class="fas fa-moon"></i>
            </button>
        </header>

        <section class="search-panel" aria-label="Search meals">
            <div class="meal-container">
                <form action="" class="meal_container-flex" id="submit" role="search">
                    <label for="search" class="sr-only">Search for a meal</label>
                    <div class="search-field">
                        <i class="fas fa-search search-icon" aria-hidden="true"></i>
                        <input type="text" id="search" placeholder="Search for a meal, e.g. Pizza" autocomplete="off">
                    </div>
                    <button class="search-btn" type="submit">
                        <i class="fas fa-search" aria-hidden="true"></i>
                        <span>Search</span>
                    </button>
                </form>
                <div class="actions">
                    <button class="random-btn" type="button" id="random">
                        <i class="fas fa-dice" aria-hidden="true"></i> Surprise me
                    </button>
                    <button class="random-btn" type="button" id="favorites">
                        <i class="fas fa-heart" aria-hidden="true"></i> Favorites
                    </button>
                </div>
            </div>
            <div class="filters-row">
                <label class="filter-field">
                    <span class="sr-only">Filter by area</span>
                    <select id="area-filter" class="filter-select"><option value="">All areas</option></select>
                </label>
                <label class="filter-field">
                    <span class="sr-only">Filter by ingredient</span>
                    <select id="ingredient-filter" class="filter-select"><option value="">All ingredients</option></select>
                </label>
                <button type="button" id="clear-filters" class="random-btn filter-clear">Clear filters</button>
            </div>
            <nav id="categories" class="categories" aria-label="Meal categories"></nav>
            <div class="favorites-tools">
                <button type="button" id="export-favorites" class="tool-btn">Export favorites</button>
                <button type="button" id="import-favorites-btn" class="tool-btn">Import favorites</button>
                <button type="button" id="clear-favorites" class="tool-btn tool-btn--danger">Clear favorites</button>
                <input type="file" id="import-favorites" accept="application/json" hidden>
            </div>
        </section>

        <p id="meal-result-heading" class="meal-result-heading" aria-live="polite"></p>
        <div id="loader" class="loader" role="status" aria-label="Loading" hidden></div>

        <div class="meals-container">
            <div id="meals" class="all-meals"></div>
        </div>

        <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>

        <nav id="pagination" class="pagination" aria-label="Pagination" hidden>
            <button type="button" id="prev-page" class="page-btn" aria-label="Previous page">&#8592; Prev</button>
            <span id="page-info" class="page-info" aria-live="polite"></span>
            <button type="button" id="next-page" class="page-btn" aria-label="Next page">Next &#8594;</button>
        </nav>

        <footer class="app-footer">
            <p>Powered by <a href="https://www.themealdb.com/" target="_blank" rel="noopener noreferrer">TheMealDB</a> &amp; <a href="https://dummyjson.com/" target="_blank" rel="noopener noreferrer">DummyJSON</a> &middot; Crafted by Hollali Kelvin</p>
        </footer>
    </div>

    <div id="modal" class="modal" hidden>
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <button type="button" id="modal-close" class="modal-close" aria-label="Close">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
